# =============================================================================
# 03-deployment-security-patch.yaml
# Replaces your existing deployment.yaml with security hardening applied:
#   - dedicated ServiceAccount per pod
#   - runAsNonRoot + runAsUser:1000
#   - readOnlyRootFilesystem:true
#   - allowPrivilegeEscalation:false
#   - CPU + memory requests/limits (prevents resource exhaustion)
#
# Ports match your docker-compose.yml:
#   api-gateway:80, checkout:3001, inventory:3002, pricing:3003
#
# Images: your local registry at localhost:5000
# Namespace: nano-service
#
# Apply: kubectl apply -f 03-deployment-security-patch.yaml -n nano-service
# =============================================================================

---
# ── api-gateway ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: nano-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nginx-container
          image: localhost:5000/api-gateway:latest
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: CHECKOUT_URL
              value: "http://checkout-service:3001"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: volume-gateway-ui
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: volume-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: volume-gateway-ui
          configMap:
            name: gateway-ui-configmap
        - name: volume-nginx-config
          configMap:
            name: nginx-default-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: nano-service
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80

---
# ── checkout-service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service-deployment
  namespace: nano-service
spec:
  replicas: 1       # KEDA will manage this — starts at 0 when idle
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      serviceAccountName: checkout-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: checkout-service-container
          image: localhost:5000/checkout-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: PRICING_URL
              value: "http://pricing-service:3003"
            - name: INVENTORY_URL
              value: "http://inventory-service:3002"
            - name: TIMEOUT_MS
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: password
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: checkout-svc
  namespace: nano-service
spec:
  selector:
    app: checkout-service
  ports:
    - port: 3001
      targetPort: 3001

