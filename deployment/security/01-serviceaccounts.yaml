# =============================================================================
# 01-serviceaccounts.yaml
# Dedicated ServiceAccounts for each service (least-privilege RBAC)
# Replaces default ServiceAccount usage across all pods.
# Apply: kubectl apply -f 01-serviceaccounts.yaml -n nano-service
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: nano-service
automountServiceAccountToken: false   # gateway needs no K8s API access

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-sa
  namespace: nano-service
automountServiceAccountToken: false   # checkout needs no K8s API access

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pricing-sa
  namespace: nano-service
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-sa
  namespace: nano-service
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: nano-service
automountServiceAccountToken: false

# No Roles or RoleBindings needed — these services make no Kubernetes API calls.
# automountServiceAccountToken: false is the key control: it prevents the
# default token from being injected, removing implicit API server access.
