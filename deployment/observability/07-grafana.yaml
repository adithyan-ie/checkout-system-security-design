# =============================================================================
# 07-grafana.yaml
# Grafana deployed to observability namespace.
# Pre-provisioned with Prometheus datasource and two dashboards:
#   1. Checkout Overview  — request rate, error rate, p50/p95 latency, replicas
#   2. Dependency Health  — per-dependency call latency and error rate
#
# Access: kubectl port-forward svc/grafana 3000:3000 -n observability
# Default login: admin / admin  (change on first login)
#
# Apply: kubectl apply -f 07-grafana.yaml -n observability
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  checkout-overview.json: |
    {
      "title": "Checkout Overview",
      "uid": "checkout-overview",
      "panels": [
        {
          "title": "Request Rate (req/s)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total{service=\"checkout-service\"}[1m]))", "legendFormat": "req/s"}]
        },
        {
          "title": "Error Rate (%)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "100 * sum(rate(http_requests_total{service=\"checkout-service\",status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{service=\"checkout-service\"}[5m]))", "legendFormat": "error %"}]
        },
        {
          "title": "Latency p50 / p95 (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{service=\"checkout-service\"}[5m])) by (le))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"checkout-service\"}[5m])) by (le))", "legendFormat": "p95"}
          ]
        },
        {
          "title": "Active checkout-service Replicas",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"nano-service\",deployment=\"checkout-service\"}", "legendFormat": "replicas"}]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }

  dependency-health.json: |
    {
      "title": "Dependency Health",
      "uid": "dependency-health",
      "panels": [
        {
          "title": "Pricing-service p95 Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"pricing-service\"}[5m])) by (le))", "legendFormat": "pricing p95"}]
        },
        {
          "title": "Inventory-service p95 Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service=\"inventory-service\"}[5m])) by (le))", "legendFormat": "inventory p95"}]
        },
        {
          "title": "Dependency Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [
            {"expr": "sum(rate(http_requests_total{service=\"pricing-service\",status_code=~\"5..\"}[5m]))", "legendFormat": "pricing errors/s"},
            {"expr": "sum(rate(http_requests_total{service=\"inventory-service\",status_code=~\"5..\"}[5m]))", "legendFormat": "inventory errors/s"}
          ]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"    # change after first login
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
